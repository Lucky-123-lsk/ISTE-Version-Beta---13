<!doctype html>
<html>
  <head><meta charset="utf-8"><title>CareerPilot</title><style>body{font:14px system-ui;width:300px;padding:14px}button,input{width:100%;padding:8px;margin-top:8px;box-sizing:border-box}#status{margin-top:10px}</style></head>
